<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#000000"/>
  <!-- M tricolor top accent -->
  <rect x="60" y="60" width="130.67" height="4" fill="#0066b1"/>
  <rect x="190.67" y="60" width="130.67" height="4" fill="#1c69d4"/>
  <rect x="321.33" y="60" width="130.67" height="4" fill="#e22718"/>
  <!-- RS Monogram -->
  <text x="256" y="240" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="180" font-weight="700" fill="#ffffff"
        text-anchor="middle" letter-spacing="-8">RS</text>
  <!-- Macro bars -->
  <rect x="80" y="300" width="352" height="10" fill="#1a1a1a"/>
  <rect x="80" y="300" width="240" height="10" fill="#1c69d4"/>
  <rect x="80" y="324" width="352" height="10" fill="#1a1a1a"/>
  <rect x="80" y="324" width="310" height="10" fill="#0fa336"/>
  <rect x="80" y="348" width="352" height="10" fill="#1a1a1a"/>
  <rect x="80" y="348" width="180" height="10" fill="#f4b400"/>
  <!-- Label -->
  <text x="256" y="420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="36" font-weight="700" fill="#7e7e7e"
        text-anchor="middle" letter-spacing="6">RECOMP</text>
  <!-- M tricolor bottom accent -->
  <rect x="60" y="448" width="130.67" height="4" fill="#0066b1" opacity="0.6"/>
  <rect x="190.67" y="448" width="130.67" height="4" fill="#1c69d4" opacity="0.6"/>
  <rect x="321.33" y="448" width="130.67" height="4" fill="#e22718" opacity="0.6"/>
</svg>
